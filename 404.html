<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>404 | LVO Vindex</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--purple:#C8A96E;--red:#CC2020;}
html,body{min-height:100%;background:#000;color:#fff;font-family:'IM Fell English',Georgia,serif;}
body{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 32px) 24px calc(env(safe-area-inset-bottom,0px) + 32px);
  background:radial-gradient(ellipse at 50% 38%,rgba(200,169,110,.14),transparent 60%),
             radial-gradient(ellipse at 50% 100%,rgba(139,0,0,.16),transparent 55%),#000;
}
.logo{width:clamp(110px,26vw,180px);height:auto;margin-bottom:1.6rem;mix-blend-mode:screen;
  filter:drop-shadow(0 0 28px rgba(139,0,0,.55)) drop-shadow(0 0 8px rgba(0,0,0,.9));
  animation:float 5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
.code{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(64px,18vw,150px);letter-spacing:.14em;
  line-height:1;color:#C8C8D0;padding-left:.14em;text-shadow:0 2px 40px rgba(0,0,0,.9);}
.rule{width:1px;height:48px;margin:1.4rem auto;background:linear-gradient(to bottom,transparent,var(--purple),transparent);}
h1{font-weight:400;font-style:italic;font-size:clamp(22px,5vw,38px);letter-spacing:.02em;line-height:1.25;}
p{margin-top:.8rem;color:rgba(255,255,255,.5);font-size:clamp(15px,3.6vw,18px);line-height:1.6;max-width:30em;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:14px;margin-top:2rem;min-height:48px;
  padding:14px 30px;text-decoration:none;color:rgba(255,255,255,.88);
  font-family:'Cinzel',serif;font-weight:600;font-size:clamp(9px,2.6vw,11px);letter-spacing:.4em;text-transform:uppercase;
  border:.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.28);
  transition:border-color .3s,color .3s,background .3s;
}
.btn:hover,.btn:focus-visible{border-color:var(--purple);color:#fff;background:rgba(200,169,110,.12);outline:none;}
.btn i{display:inline-block;width:24px;height:1px;background:currentColor;opacity:.5;transition:width .3s;}
.btn:hover i{width:36px;}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.2rem 1.4rem;margin-top:2.2rem;}
nav a{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;
  color:rgba(255,255,255,.4);padding:10px 0;border-bottom:.5px solid rgba(139,0,0,.3);transition:color .3s,border-color .3s;}
nav a:hover,nav a:focus-visible{color:#fff;border-color:var(--red);outline:none;}
</style>
</head>
<body>
  <img class="logo" src="/assets/apple-touch-icon.png" alt="LVO" width="180" height="180">
  <div class="code">404</div>
  <div class="rule"></div>
  <h1>This path leads nowhere.</h1>
  <p>The page you’re looking for has moved, been removed, or never existed.</p>
  <a class="btn" href="/">LVO Vindex <i></i></a>
  <nav aria-label="Divisions">
    <a href="https://wearelvo.com/">LVO Holdings</a>
    <a href="https://vindex.wearelvo.com">Vindex</a>
    <a href="https://alliance.wearelvo.com">Alliance</a>
    <a href="https://operations.wearelvo.com">Operations</a>
    <a href="https://wearelvo.com/careers/">Careers</a>
  </nav>
</body>
</html>
